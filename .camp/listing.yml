name: filter_timezone
summary: 'A text filter that converts date/times inserted by the companion tiny_timezone editor plugin into each viewing user''s own timezone.'
description: |
  Converts date/time spans authored with the companion **Timezone date/time**
  TinyMCE plugin (`tiny_timezone`) from the timezone they were written in to
  the timezone of the user viewing the page — `2026-06-24 14:00 (Asia/Tokyo)`
  becomes `2026-06-24 17:00 (Pacific/Auckland)` for a viewer in New Zealand.
  The timezone converted to is always shown alongside the rewritten time.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
screenshots:
  - path: .camp/screenshots/01-converted-time.png
    caption: A time written for Tokyo, shown to this viewer in their own timezone (America/New_York)
  - path: .camp/screenshots/02-converted-time-page.png
    caption: The converted time on the full page
